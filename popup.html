<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>RAW Data Interceptor</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <div class="tabs">
                <button class="tablink active" data-tab="general">
                    General
                </button>
                <button class="tablink" data-tab="advanced">Advanced</button>
                <button class="tablink" data-tab="filters">Filters</button>
            </div>

            <div id="general" class="tabcontent" style="display: block">
                <div class="option">
                    <label for="masterSwitch">
                        <h3>Enable Interceptor</h3>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="masterSwitch" checked />
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="option">
                    <label for="WebhookOption">
                        <h3>Enable Webhook</h3>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="WebhookOption" />
                        <span class="slider round"></span>
                    </label>
                </div>

                <div
                    class="option flex flex-wrap gap-10"
                    id="WebhookOption_container"
                >
                    <label for="WebhookUrl"><h4>URL</h4></label>
                    <input
                        type="text"
                        id="WebhookUrl"
                        placeholder="Webhook URL"
                    />
                </div>

                <div class="option">
                    <label for="OpenWindow">
                        <h3>Open Window</h3>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="OpenWindow" />
                        <span class="slider round"></span>
                    </label>
                </div>

                <div
                    class="option flex flex-wrap gap-10"
                    id="OpenWindow_container"
                >
                    <label for="WindowUrl"><h4>URL</h4></label>
                    <input
                        type="text"
                        id="WindowUrl"
                        placeholder="Window URL"
                        value="https://nglmercer.github.io/multistreamASTRO/"
                    />
                </div>
            </div>

            <div id="advanced" class="tabcontent">
                <div class="option">
                    <label for="debugMode">
                        <h3>Debug Mode</h3>
                    </label>
                    <label class="switch">
                        <input type="checkbox" id="debugMode" />
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="option flex flex-wrap gap-10">
                    <label for="eventBufferSize"
                        ><h4>Event Buffer Size</h4></label
                    >
                    <input
                        type="number"
                        id="eventBufferSize"
                        value="1000"
                        min="100"
                        max="10000"
                    />
                </div>

                <button class="btn-save" id="saveAdvanced">
                    Save Advanced
                </button>
                <button class="reset" id="resetAdvanced">Reset</button>
            </div>

            <div id="filters" class="tabcontent">
                <div class="option">
                    <label><h3>🔌 WebSocket</h3></label>
                    <label class="switch">
                        <input type="checkbox" id="wsEnabled" checked />
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="option flex flex-wrap gap-10" id="wsFilters">
                    <label><h4>URL Filters (one per line):</h4></label>
                    <textarea id="wsUrlFilters" rows="4">
webcast
tiktok.com
im-ws
pusher
irc-ws.chat.twitch.tv</textarea
                    >
                </div>

                <div class="option flex flex-wrap gap-10">
                    <label><h4>Size Limits (bytes):</h4></label>
                    <div style="display: flex; gap: 10px; align-items: center">
                        <label style="flex: 1">Min:</label>
                        <input
                            type="number"
                            id="wsMinSize"
                            value="10"
                            min="0"
                            style="width: 80px"
                        />
                        <label style="flex: 1">Max:</label>
                        <input
                            type="number"
                            id="wsMaxSize"
                            value="10000"
                            min="1"
                            style="width: 80px"
                        />
                    </div>
                </div>

                <div class="option flex flex-wrap gap-10">
                    <label><h4>Exclude Strings:</h4></label>
                    <input
                        type="text"
                        id="wsExcludeStrings"
                        value="hi,pong,ping"
                        placeholder="comma separated"
                    />
                </div>

                <div class="option">
                    <button class="btn-save" id="saveFilters">
                        Save Filters
                    </button>
                    <button class="reset" id="resetFilters">
                        Reset to Default
                    </button>
                    <button class="btn-export" id="exportConfig">
                        📤 Export
                    </button>
                    <button class="btn-import" id="importConfig">
                        📥 Import
                    </button>
                </div>
            </div>

            <div class="footer">
                <div id="status" class="status"></div>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
