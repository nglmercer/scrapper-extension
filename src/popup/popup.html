<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAW Data Interceptor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <h1>RAW Interceptor</h1>
                <span class="version">v3.1.0</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="popOutBtn" title="Open in new window">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </button>
                <div class="status-indicator" id="connectionStatus" title="Connection Status"></div>
            </div>
        </header>

        <tab-container id="main-tabs" 
                       tabs='[
                         {"id": "general", "label": "General", "icon": "⚙️"},
                         {"id": "advanced", "label": "Advanced", "icon": "🔧"},
                         {"id": "filters", "label": "Filters", "icon": "🔍"}
                       ]' 
                       active-tab="general">
            
            <!-- General Tab -->
            <section id="general" class="tab-content active">
                <setting-card>
                    <switch-toggle label="Enable Interceptor" 
                                   description="Global master switch for all extraction"
                                   state-key="masterSwitch"
                                   checked="true">
                    </switch-toggle>
                </setting-card>

                <setting-card header="Webhook Integration" collapsible="true">
                    <switch-toggle label="Webhook Integration" 
                                   description="Send intercepted data to external URL"
                                   state-key="WebhookOption">
                    </switch-toggle>
                    <div class="card-content collapsible" id="WebhookOption_container">
                        <div class="input-group">
                            <label for="WebhookUrl">Webhook URL</label>
                            <input type="text" id="WebhookUrl" placeholder="https://api.example.com/webhook">
                        </div>
                    </div>
                </setting-card>

                <setting-card header="External Window" collapsible="true">
                    <switch-toggle label="External Window" 
                                   description="Display data in a separate popped-out window"
                                   state-key="OpenWindow">
                    </switch-toggle>
                    <div class="card-content collapsible" id="OpenWindow_container">
                        <div class="input-group">
                            <label for="WindowUrl">Window URL</label>
                            <input type="text" id="WindowUrl" placeholder="https://..." value="/">
                        </div>
                    </div>
                </setting-card>

                <setting-card header="Native Messaging" collapsible="true">
                    <switch-toggle label="Native Messaging" 
                                   description="Send data to local application"
                                   state-key="nativeMessaging.enabled">
                    </switch-toggle>
                    <div class="card-content collapsible" id="native_container">
                        <div class="input-group">
                            <label for="nativeAppName">App Name (com.company.app)</label>
                            <input type="text" id="nativeAppName" placeholder="com.scrapper.host">
                        </div>
                    </div>
                </setting-card>

                <setting-card header="WebSocket Stream" collapsible="true">
                    <switch-toggle label="WebSocket Stream" 
                                   description="Stream data to a WS Server"
                                   state-key="socketStream.enabled">
                    </switch-toggle>
                    <div class="card-content collapsible" id="socket_container">
                        <div class="input-group">
                            <label for="socketUrl">WS Server URL</label>
                            <input type="text" id="socketUrl" placeholder="ws://localhost:3000">
                        </div>
                    </div>
                </setting-card>
            </section>

            <!-- Advanced Tab -->
            <section id="advanced" class="tab-content">
                <setting-card>
                    <switch-toggle label="Debug Mode" 
                                   description="Verbose logging to console"
                                   state-key="debugMode">
                    </switch-toggle>
                </setting-card>

                <setting-card>
                    <div class="card-content">
                        <div class="input-group">
                            <label for="eventBufferSize">Event Buffer Size</label>
                            <input type="number" id="eventBufferSize" value="1000" min="100" max="10000">
                            <p class="help-text">Max events to keep in memory (100-10000)</p>
                        </div>
                    </div>
                </setting-card>

                <div class="actions-row">
                    <button class="btn btn-primary" id="saveAdvanced">Save Settings</button>
                    <button class="btn btn-secondary" id="resetAdvanced">Reset</button>
                </div>
            </section>

            <!-- Filters Tab -->
            <section id="filters" class="tab-content">
                <setting-card>
                    <switch-toggle label="WebSocket Interception" 
                                   description="Enable/Disable WS traffic capturing"
                                   state-key="websockets.enabled"
                                   checked="true">
                    </switch-toggle>
                </setting-card>

                <setting-card header="URL Filters" badge="Contains">
                    <div class="card-content">
                        <tag-input id="urlFilters" 
                                   placeholder="Add filter and press Enter..."
                                   state-key="websockets.urlFilters"
                                   delimiter="\n"
                                   tags='["webcast", "tikfinity.zerody.one", "irc-ws.chat.twitch.tv"]'>
                        </tag-input>
                    </div>
                </setting-card>

                <setting-card header="Payload Limits (Bytes)">
                    <div class="card-content row">
                        <div class="input-group flex-1">
                            <label for="wsMinSize">Min Size</label>
                            <input type="number" id="wsMinSize" value="10" min="0">
                        </div>
                        <div class="input-group flex-1">
                            <label for="wsMaxSize">Max Size</label>
                            <input type="number" id="wsMaxSize" value="10000" min="1">
                        </div>
                    </div>
                </setting-card>

                <setting-card header="Exclude Strings">
                    <div class="card-content">
                        <tag-input id="excludeStrings" 
                                   placeholder="Add string and press Enter..."
                                   state-key="websockets.excludeStrings"
                                   delimiter=","
                                   tags='["hi", "pong", "ping"]'>
                        </tag-input>
                    </div>
                </setting-card>

                <div class="actions-row">
                    <button class="btn btn-primary" id="saveFilters">Save Filters</button>
                    <button class="btn btn-secondary" id="resetFilters">Reset</button>
                </div>

                <div class="divider"></div>

                <div class="actions-row">
                    <button class="btn btn-outline" id="exportConfig">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Export
                    </button>
                    <button class="btn btn-outline" id="importConfig">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        Import
                    </button>
                </div>
            </section>
        </tab-container>

        <div id="toast" class="toast hidden">Settings saved</div>
    </div>
    
    <script type="module" src="popup-manager.js"></script>
</body>
</html>
